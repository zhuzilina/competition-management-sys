server {
    listen       80;
    server_name  localhost;
    client_max_body_size 10M;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    # 2. AI 聊天接口代理 (关键部分)
    location /ai/ {
        # 换成你真正的后端地址，注意末尾是否有斜杠需与后端匹配
        proxy_pass http://web:8000/ai/; 
        
        # 基础代理配置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- 以下是针对 AI 流式输出(SSE)的特殊优化 ---
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 禁用缓存，确保数据实时流向前端
        proxy_buffering off;
        proxy_cache off;
        
        # 针对长连接的超时设置（防止 AI 思考太久被 Nginx 主动断开）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        
        # 允许分块传输
        chunked_transfer_encoding on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # 将 Vite 中配置的 proxy 搬到这里
    # 统一匹配接口前缀
    location ~ ^/(user-profile|user|comp|cert|award|apply|team|notification) {
        client_max_body_size 10M;
        proxy_pass http://web:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://web:8000/media/;
    }
}